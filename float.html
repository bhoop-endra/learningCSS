<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex float grid</title>
    <style>
        .bhu{
            height: 250px;
            width: 500px;
            border: 2px solid ;
            background-color: aqua;
        }
        #nji{
            height: 100px;
            width:100px;

        }

            width: 100px;
            border: 2px solid greenyellow;
            background-color: blueviolet;

        }

    </style>

<body>
    <div class="bhu">
        <div id="nji">Bhoop</div>
        <div id="nji1">Bhoopendra</div>

    </div>
</body>
</html>
