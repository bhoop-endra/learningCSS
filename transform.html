<!DOCTYPE html>
<html lang="en">
<head>

    <title>Transform</title>
    <style>

        #fgh{

            /* transform: rotate(36deg); */

            transition: all;
            transition-duration: 2s;

        #fgh:hover{
         background-color: blue;
        /* transform:scale(2); 
        transform: rotate(90deg); 
        transform: skew(2); */

            transform: skew(95deg);
        }
