<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        .con{
            position: relative
        }
        #dl{
            background-color: aqua; width: 80px; margin: 30px; height: 40px;border: 3px dashed blue;text-align: center;font-size: 30px;z-index: 2;
        }


        #pl{
            background-color: blue; width:120px;margin: 30px;height: 40px;border:3px solid black;text-align: center;font-size: 35px;z-index:1;
        }


    </style>
</head>
<body>
    <div class="con">
        <div id="dl">
            Ram
        </div>
        <div id="pl">
            Bhoop
        </div>


    </div>
</body>
</html>
