    <title>Position</title>
    <style>
        #edc{
            background-color: blue;

            margin: 20px;

        }
        #edc4{
            background-color: rgb(61, 42, 165);
            height: 50px;width: 100px;margin: 20px;position: fixed;left: 450px;
            top:550px
        }
.ram{
